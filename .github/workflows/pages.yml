# Rebuilds and deploys https://cv.vishalg.in whenever the CV PDF (or the builder) changes.
# One-time setup: repo Settings → Pages → Source: GitHub Actions.
name: Build and deploy CV

on:
  push:
    branches: [main]
    paths:
      - "CV/**.pdf"
      - "build/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, so "Updated" uses the PDF's commit date

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r build/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pandoc

      - name: Build site from the PDF
        run: python build/build.py --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
