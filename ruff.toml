target-version = "py312"
line-length = 120

[lint]
select = ["E", "F", "W", "B", "UP", "SIM", "PL"]
# Length/complexity limits don't suit a parser built from many small rules; E501 is covered by line-length review.
ignore = ["E501", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW2901", "PLC0415", "SIM108"]
